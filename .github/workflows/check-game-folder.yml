name: Check allowed files

on:
  pull_request:
    branches:
      - master

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          if grep -v '^game/' changed_files.txt | grep -q .; then
            echo "ERROR: Files outside game/ were modified!"
            exit 1
          fi

          echo "OK: Only files inside game/ were modified."
